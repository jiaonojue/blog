<!doctype html>
<html lang="zh-CN" data-theme="daylight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/blog/art/favicon.svg" />
    <link rel="sitemap" type="application/xml" href="/blog/sitemap.xml" />
    <title>回声记录</title>
    <meta name="description" content="一个写番剧感想、技术备忘与生活随笔的个人博客。" />
    <!-- 主题必须在首屏渲染前确定，否则会闪一下白底 -->
    <script>
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('site:settings:v1') || '{}')
          var theme = s.theme || 'daylight'
          if (theme === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'neon' : 'daylight'
          }
          document.documentElement.dataset.theme = theme
          if (s.motion === 'off') document.documentElement.dataset.motion = 'off'
        } catch (e) {
          /* localStorage 被禁用时用默认值，不要因为这里报错让整站白屏 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
