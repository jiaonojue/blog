<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    站点图标（favicon）—— 一枚红色印章，中间一个「記」字。
    想换字：把下面 <text> 里的「記」改成你要的字（一个汉字最好）。
    想换颜色：把两处 #ff5c8a 换成你的主色。
  -->
  <rect width="100" height="100" rx="22" fill="#fff8f4" />
  <rect x="8" y="8" width="84" height="84" rx="14" fill="none" stroke="#ff5c8a" stroke-width="7" />
  <text
    x="50"
    y="52"
    text-anchor="middle"
    dominant-baseline="central"
    font-size="54"
    font-family="KaiTi, STKaiti, 'Noto Serif CJK SC', serif"
    font-weight="700"
    fill="#ff5c8a"
  >記</text>
</svg>
