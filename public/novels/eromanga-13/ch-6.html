<p>我是伏见司。</p>
<p>因为该写的都在正文里写完了，所以正在犹豫后记要写什么。</p>
<p>自本作品的第一卷发售以来，经过了很长时间，终于写完了最终卷。</p>
<p>冠崎广老师，谢谢您。</p>
<p>谢谢各位读者。</p>
<p>如果能喜欢上任何一名在本作品中登场的角色。</p>
<p>如果大家在阅读本作时笑过一次。</p>
<p>如果大家今后能时常回想起来这部作品。</p>
<p>我会非常高兴。</p>
<p class="right">二〇二二年六月 伏见司</p>
